# Exemple de fichier de valeurs pour criv-client
# Utilisation: helm install criv-client ./helm -f examples/criv-client-values.yaml

nameOverride: "criv-client"
fullnameOverride: "criv-client"

namespace:
  name: pnud-agvm
  create: true

image:
  registry: harbor.example.com
  repository: criv-client
  tag: latest
  pullPolicy: Always
  pullSecrets:
    - name: harbor-registry-secret

replicaCount: 1

service:
  enabled: true
  type: NodePort
  port: 4004
  targetPort: 4004
  nodePort: 30040

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

securityContext:
  enabled: false

envFromSecret:
  enabled: true
  createSecret: true
  data:
    VITE_API_URL: "https://api.example.com"
    VITE_PORT: "4004"
